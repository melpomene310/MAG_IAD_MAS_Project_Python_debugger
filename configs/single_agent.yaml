# Сравнение вариантов: конфиги отличаются только `solver` и параметрами решателя.
solver: single_agent
data_dir: data/processed
split_preset: paper3
results_dir: results

max_attempts: 3            # = max_submissions
max_tokens_per_task: 300000
task_timeout_s: 1800
initial_failing_shown: 2
show_expected_output: true

# специфичное для single_agent
max_steps: 30
tools: [run_tests, get_test, run_program, trace, submit]
tool_failing_shown: 2
tool_response_max_chars: 3000
context_keep_steps: 6
trace_max_hits: 30

memory_mb: 1024
sandbox_workers: 8

llm:
  temperature: 0
  max_output_tokens: 16384   # без лимита модель может «думать» 100k+ токенов и ~10 минут
  reasoning: {enabled: false}  # без рассуждений: быстрее и дешевле
