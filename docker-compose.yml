services:
  app:
    build: .
    image: debugmas:latest
    env_file: ${DEBUGMAS_ENV_FILE:-.env}
    environment:
      DEBUGMAS_ENV_FILE: ${DEBUGMAS_ENV_FILE:-.env}
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
